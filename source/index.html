<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#191720">
    <title>ซิงเจียน · ห้องชมวิวอวกาศส่วนตัว</title>
    <style>/* CABIN_STYLE */</style>
</head>
<body>
    <svg class="visually-hidden" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <symbol id="i-orbit" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10.5" ry="4.4" transform="rotate(-31 12 12)"/><path d="M12 5.5 13.5 10.4 18.4 12 13.5 13.6 12 18.5 10.5 13.6 5.6 12 10.5 10.4Z"/></symbol>
            <symbol id="i-signal" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M8 7a6.5 6.5 0 0 0 0 10m8 0a6.5 6.5 0 0 0 0-10M5 4a10.5 10.5 0 0 0 0 16m14 0a10.5 10.5 0 0 0 0-16"/></symbol>
            <symbol id="i-archive" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="m4 9 2-5h12l2 5m-10 4h4"/></symbol>
            <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="m7.5 9 3 3-3 3m6-1h3"/></symbol>
            <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h7m4 0h5M4 17h4m4 0h8"/><circle cx="13" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
            <symbol id="i-window" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="4"/><path d="m8 15 3-3 2 2 3-3m-1-2h.01"/></symbol>
            <symbol id="i-left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
            <symbol id="i-right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
            <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
            <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12m0-12L6 18"/></symbol>
            <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5 18.5 12 8 18.5Z"/></symbol>
            <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></symbol>
            <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
            <symbol id="i-send" viewBox="0 0 24 24"><path d="m3.5 10.5 17-6-6 16-3.4-7-7.6-3ZM11 13l9-8"/></symbol>
            <symbol id="i-back" viewBox="0 0 24 24"><path d="m10 6-6 6 6 6m-6-6h16"/></symbol>
            <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-2.6-2-5-2.5-8-1.5v14c3-1 5.4-.5 8 1.5 2.6-2 5-2.5 8-1.5v-14C17 3.5 14.6 4 12 6Zm0 0v14"/></symbol>
            <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5m6-5v5M7 8h10v3a5 5 0 0 1-10 0V8Zm5 8v5"/></symbol>
            <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6h14M12 6v13m-4 0h8"/></symbol>
            <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></symbol>
            <symbol id="i-blocks" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M17 14v6m-3-3h6"/></symbol>
        </defs>
    </svg>

    <div class="cabin" id="cabin" data-page="home" data-route="galaxy">
        <div class="scene" aria-hidden="true">
            <div class="scene-plate">
                <div class="cabin-photo"></div>
                <div class="window-glass">
                    <div class="vista vista-rings"></div>
                    <div class="vista vista-dawn"></div>
                    <div class="window-shade"></div>
                    <div class="star-reflections"></div>
                </div>
            </div>
            <div class="cabin-light"></div>
        </div>

        <header class="cabin-mark" aria-label="ซิงเจียน">
            <svg aria-hidden="true"><use href="#i-orbit"/></svg>
            <span>ซิงเจียน</span>
        </header>

        <div class="welcome" id="welcome">
            <div class="orb" aria-hidden="true"></div>
            <p>ยินดีต้อนรับกลับมา ผู้บัญชาการ</p>
        </div>

        <main class="projection-deck" id="home" aria-labelledby="recent-title">
            <div class="projection-header">
                <span class="projection-status" aria-hidden="true"></span>
                <h1 id="recent-title">การสื่อสารล่าสุด</h1>
                <span class="role-position" id="role-position" aria-hidden="true"></span>
            </div>
            <div class="carousel" id="carousel" tabindex="0" role="region" aria-label="ตัวละครล่าสุด ใช้ปุ่มลูกศรซ้าย-ขวาเพื่อสลับ">
                <div class="projection-beam" aria-hidden="true"></div>
                <div class="orbit-track" aria-hidden="true"></div>
                <div class="cards" id="cards"></div>
            </div>
            <div class="role-controls">
                <button class="holo-key direction-key" id="previous" type="button" aria-label="ตัวละครก่อนหน้า" title="ตัวละครก่อนหน้า">
                    <svg aria-hidden="true"><use href="#i-left"/></svg>
                </button>
                <h2 id="active-role" aria-live="polite"></h2>
                <button class="holo-key direction-key" id="next" type="button" aria-label="ตัวละครถัดไป" title="ตัวละครถัดไป">
                    <svg aria-hidden="true"><use href="#i-right"/></svg>
                </button>
            </div>
            <div class="role-actions">
                <button class="holo-key continue-key" id="continue-chat" type="button">
                    <svg aria-hidden="true"><use href="#i-play"/></svg><span>เล่าเรื่องต่อ</span>
                </button>
                <button class="holo-key" id="choose-session" type="button">
                    <svg aria-hidden="true"><use href="#i-archive"/></svg><span>บันทึก</span>
                </button>
            </div>
            <div class="emitter" aria-hidden="true"><span></span></div>
        </main>

        <main class="panel library" id="library" hidden aria-labelledby="library-heading">
            <header class="panel-head">
                <div><h1 id="library-heading">คลังตัวละคร</h1><p id="role-count"></p></div>
                <button class="holo-key" id="add-images" type="button"><svg aria-hidden="true"><use href="#i-plus"/></svg>เพิ่มรูปตัวอย่าง</button>
            </header>
            <div class="search-field">
                <svg aria-hidden="true"><use href="#i-search"/></svg>
                <label class="visually-hidden" for="search">ค้นหาตัวละคร</label>
                <input id="search" type="search" autocomplete="off" placeholder="ค้นหาตัวละคร">
            </div>
            <div class="archive-scroll" id="archive-scroll">
                <div class="archive-grid" id="archive-grid"></div>
                <p class="empty-search" id="empty-search" hidden>ไม่พบตัวละครที่ตรงกัน</p>
            </div>
        </main>

        <main class="panel conversation" id="chat" hidden aria-labelledby="chat-role">
            <header class="panel-head chat-head">
                <button class="holo-key" id="chat-back" type="button">
                    <svg aria-hidden="true"><use href="#i-back"/></svg><span>กลับ</span>
                </button>
                <div class="chat-heading"><h1 id="chat-role"></h1><p id="chat-title"></p></div>
                <button class="holo-key" id="chat-sessions" type="button">
                    <svg aria-hidden="true"><use href="#i-archive"/></svg><span>บันทึก</span>
                </button>
            </header>
            <div class="log-wrap">
                <div class="chat-log" id="chat-log" role="log" tabindex="0" aria-label="ประวัติการสื่อสาร"></div>
                <button class="holo-key jump-key" id="jump-latest" type="button" hidden>
                    <svg aria-hidden="true"><use href="#i-down"/></svg>ข้อความล่าสุด
                </button>
            </div>
            <form class="composer" id="composer">
                <label class="visually-hidden" for="message">ข้อความตัวอย่าง</label>
                <textarea id="message" rows="1" maxlength="4000" placeholder="เขียนสิ่งที่อยากพูด…" required></textarea>
                <button class="holo-key" type="submit"><svg aria-hidden="true"><use href="#i-send"/></svg><span>ส่ง</span></button>
            </form>
        </main>

        <nav class="sill-controls mounted" aria-label="แผงควบคุมหน้าต่าง">
            <button class="cabin-key route-key" type="button" data-dialog="routes" aria-haspopup="dialog">
                <svg aria-hidden="true"><use href="#i-orbit"/></svg><span id="route-label">ล่องทางช้างเผือก</span>
                <svg class="key-chevron" aria-hidden="true"><use href="#i-down"/></svg>
            </button>
            <button class="cabin-key view-key" id="scenic" type="button" aria-pressed="false">
                <svg aria-hidden="true"><use href="#i-window"/></svg><span>ชมวิว</span>
            </button>
        </nav>

        <nav class="wall-controls mounted" id="wall-controls" aria-label="แผงควบคุมผนังห้อง">
            <button class="cabin-key" type="button" data-page-button="home" aria-current="page">
                <svg aria-hidden="true"><use href="#i-signal"/></svg><span>ห้องสื่อสาร</span>
            </button>
            <button class="cabin-key" type="button" data-page-button="library">
                <svg aria-hidden="true"><use href="#i-archive"/></svg><span>ตัวละคร</span>
            </button>
            <button class="cabin-key" type="button" data-dialog="terminal" aria-haspopup="dialog">
                <svg aria-hidden="true"><use href="#i-terminal"/></svg><span>เมนู</span>
            </button>
            <button class="cabin-key" type="button" data-dialog="settings" aria-haspopup="dialog">
                <svg aria-hidden="true"><use href="#i-settings"/></svg><span>ตั้งค่าห้อง</span>
            </button>
        </nav>
    </div>

    <dialog class="attached-sheet route-sheet" id="routes" aria-labelledby="routes-title">
        <header class="sheet-head">
            <h2 id="routes-title">เลือกเส้นทาง</h2>
            <button class="holo-key close-key" type="button" data-close aria-label="ปิดเส้นทาง" title="ปิด"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
        </header>
        <div class="route-list">
            <button class="route-option" data-route-option="galaxy" type="button" aria-pressed="true">
                <span class="route-thumbnail thumbnail-galaxy" aria-hidden="true"></span>
                <span>ล่องทางช้างเผือก</span>
                <span class="route-dot" aria-hidden="true"></span>
            </button>
            <button class="route-option" data-route-option="rings" type="button" aria-pressed="false">
                <span class="route-thumbnail thumbnail-rings" aria-hidden="true"></span>
                <span>ชมวงแหวนดาว</span>
                <span class="route-dot" aria-hidden="true"></span>
            </button>
            <button class="route-option" data-route-option="dawn" type="button" aria-pressed="false">
                <span class="route-thumbnail thumbnail-dawn" aria-hidden="true"></span>
                <span>รุ่งอรุณวงโคจร</span>
                <span class="route-dot" aria-hidden="true"></span>
            </button>
        </div>
    </dialog>

    <dialog class="attached-sheet" id="terminal" aria-labelledby="terminal-title">
        <header class="sheet-head">
            <h2 id="terminal-title">เมนู</h2>
            <button class="holo-key close-key" type="button" data-close aria-label="ปิดเมนู" title="ปิด"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
        </header>
        <div class="terminal-grid" id="terminal-keys"></div>
        <p class="sheet-note" id="terminal-note" aria-live="polite">นี่คือตัวอย่างแบบแยกเดี่ยว เมื่อต่อเข้ากับ SillyTavern ตรงนี้จะเปิดแผงฟังก์ชันเดิม</p>
    </dialog>

    <dialog class="attached-sheet" id="settings" aria-labelledby="settings-title">
        <header class="sheet-head">
            <h2 id="settings-title">ตั้งค่าห้องโดยสาร</h2>
            <button class="holo-key close-key" type="button" data-close aria-label="ปิดตั้งค่าห้องโดยสาร" title="ปิด"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
        </header>
        <div class="setting">
            <label for="brightness">ความสว่างของวิว</label>
            <input id="brightness" type="range" min="30" max="100" value="86">
            <output id="brightness-value" for="brightness">86%</output>
        </div>
        <div class="setting">
            <label for="still-mode">ลดภาพเคลื่อนไหว</label>
            <button class="physical-switch" id="still-mode" type="button" role="switch" aria-checked="false" aria-label="ลดภาพเคลื่อนไหว"><span></span></button>
        </div>
    </dialog>

    <dialog class="attached-sheet session-sheet" id="sessions" aria-labelledby="sessions-title">
        <header class="sheet-head">
            <div><h2 id="sessions-title">บันทึกการสื่อสาร</h2><p id="session-role"></p></div>
            <button class="holo-key close-key" type="button" data-close aria-label="ปิดบันทึกการสื่อสาร" title="ปิด"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
        </header>
        <div class="session-list" id="session-list"></div>
        <button class="holo-key new-session" id="new-session" type="button">
            <svg aria-hidden="true"><use href="#i-plus"/></svg>เริ่มเรื่องใหม่
        </button>
    </dialog>

    <input type="file" id="image-input" accept="image/*" multiple hidden>
    <div class="toast" id="toast" role="status" hidden></div>
    <script>/* CABIN_SCRIPT */</script>
</body>
</html>
